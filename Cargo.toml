[workspace]
resolver = "2"
members = [
    "crates/chain",
    "crates/core",
    "crates/file_store",
    "crates/electrum",
    "crates/esplora",
    "crates/bitcoind_rpc",
    "crates/testenv",
]

[workspace.package]
authors = ["Bitcoin Dev Kit Developers"]

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }

[patch.crates-io]
# The compat layer branch: https://github.com/satsfy/rust-bitcoin/pull/38
bitcoin = { git = "https://github.com/satsfy/rust-bitcoin", branch = "units-compat-demo2", default-features = false, features = [
    "compat",
] }
